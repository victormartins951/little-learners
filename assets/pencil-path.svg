<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770"><rect width="600" height="770" fill="#fff"/><rect width="600" height="86" fill="#eee5ff"/><text x="30" y="52" font-family="Arial" font-size="34" font-weight="bold" fill="#273b52">Pencil Paths — Waves</text><text x="30" y="113" font-family="Arial" font-size="18" fill="#667588">Move your pencil slowly along the path.</text><text x="30" y="160" font-family="Arial" font-size="17">Name: ________________________</text><text x="35" y="222" font-family="Arial" font-size="23" fill="#273b52">Start at the star and follow the path.</text><text x="35" y="290" font-family="Arial" font-size="50" fill="#e4b64f">★</text><path d="M95 275 Q140 195 185 275 T275 275 T365 275 T455 275" fill="none" stroke="#b8a8d9" stroke-width="7" stroke-dasharray="12 14" stroke-linecap="round"/><text x="475" y="291" font-family="Arial" font-size="47" fill="#d999b0">✿</text><text x="35" y="377" font-family="Arial" font-size="23" fill="#273b52">Practice the path again:</text><path d="M35 485 Q90 395 145 485 T255 485 T365 485 T475 485 T585 485" fill="none" stroke="#b8a8d9" stroke-width="6" stroke-dasharray="11 13" stroke-linecap="round"/><path d="M35 620 Q90 530 145 620 T255 620 T365 620 T475 620 T585 620" fill="none" stroke="#b8a8d9" stroke-width="6" stroke-dasharray="11 13" stroke-linecap="round"/><text x="35" y="730" font-family="Arial" font-size="19" fill="#667588">Pencil tip: gentle hands and slow movements!</text></svg>