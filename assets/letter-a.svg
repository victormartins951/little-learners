<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770"><rect width="600" height="770" fill="#fff"/><rect x="0" width="600" height="86" fill="#dff3f8"/><text x="30" y="52" font-family="Arial" font-size="34" font-weight="bold" fill="#273b52">Letter A</text><text x="30" y="113" font-family="Arial" font-size="18" fill="#667588">Trace, say, and find the letter.</text><text x="30" y="160" font-family="Arial" font-size="17">Name: ________________________</text><rect x="35" y="190" width="530" height="180" rx="15" fill="#f7fbfd" stroke="#c6dfe7"/><text x="130" y="335" font-family="Arial" font-size="146" fill="#b4d4df">A</text><text x="340" y="335" font-family="Arial" font-size="146" fill="#b4d4df">a</text><text x="35" y="415" font-family="Arial" font-size="23" font-weight="bold" fill="#273b52">Trace the letters:</text><text x="40" y="490" font-family="Arial" font-size="60" fill="#bacad1">A a A a A a</text><path d="M35 510H565 M35 555H565" stroke="#a7bbc6" stroke-width="2" stroke-dasharray="8 10"/><text x="35" y="607" font-family="Arial" font-size="25" fill="#273b52">A is for apple!</text><text x="35" y="660" font-family="Arial" font-size="21" fill="#273b52">Circle the matching letter:</text><text x="40" y="713" font-family="Arial" font-size="35" letter-spacing="13" fill="#4a5b69">L J F A R</text></svg>